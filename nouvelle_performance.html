<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#F1F5F0]">
    <main class="flex justify-center items-center flex-col gap-6">
        <h1 class="text-4xl pt-10 pl-10 font-bold flex justify-center">NOUVELLE PERFORMANCE</h1>
        <div class="bg-white rounded-2xl border border-gray-100 w-210 pl-10 pr-10  ">
            <div>
                <div class="block font-semibold text-gray-800 text-base my-4">Participant</div>
                <div class=" w-full border border-gray-300 rounded-xl px-4 py-3 bg-white text-gray-400">Choisir
                    un inscrit</div>
            </div>
            <div>
                <h2 class="block font-semibold text-gray-800 text-base my-4">Valeur</h2>
                <div class=" w-full border border-gray-300 rounded-xl px-4 py-3 bg-white text-gray-400">0</div>
            </div>
            <div>
                <h2 class="block font-semibold text-gray-800 text-base my-4">Unité</h2>
                <div class=" w-full border border-gray-300 rounded-xl px-4 py-3 bg-white text-gray-400">km</div>
            </div>
            <div>
                <button class="w-full bg-[#C5F03A] text-black font-semibold py-3 px-4 my-6 rounded-xl text-center">Enregistrer</button>
            </div>
            <p class="text-sm text-red-500 p-4">Les valeurs négatives sont refusées.</p>
        </div>
    </main>

    
</body>

</html>
